name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test fail-closed history scanning
        run: ./scripts/test-secret-history.sh
      - name: Scan complete Git history
        run: ./scripts/verify-secret-history.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Reject forbidden repository artefacts
        run: |
          test -z "$(find . -path './.git' -prune -o \( -name target -o -name libs -o -name '*.jar' -o -name '*.class' -o -name '.env' -o \( -name '.env.*' ! -name '*.example' \) \) -print)"
      - name: Build and test
        run: mvn -B --no-transfer-progress clean verify
      - name: Build container
        run: docker build --tag local/job-finder-gateway:ci .
